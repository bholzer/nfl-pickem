production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  deliver_submission_links:
    class: DeliverSubmissionLinksJob
    schedule: every tuesday at 9am
  check_and_deliver_standings_thursday:
    class: DeliverStandingsJob
    schedule: '*/15 21-23 * * 4'
  check_and_deliver_standings_sunday:
    class: DeliverStandingsJob
    schedule: '*/15 15-23 * * 0'
  check_and_deliver_standings_monday:
    class: DeliverStandingsJob
    schedule: '*/15 21-23 * * 1'
  schedule_hash_delivery:
    class: ScheduleHashDeliveryJob
    schedule: every thursday at 9am
