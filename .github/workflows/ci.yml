name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.7
      - name: Install locked Node dependencies
        run: npm ci
      - name: Check Prettier and Tailwind class formatting
        run: npm run format:check
      - name: Check client, server, and tooling types
        run: npm run typecheck
      - name: Enforce strict lint and complexity limits
        run: npm run lint
      - name: Check framework-aware dead code
        run: npm run deadcode
      - name: Report readability measurements
        run: npm run metrics
      - name: Run domain and operations unit tests
        run: npm run test:unit
      - name: Run React client tests
        run: npm run test:client
      - name: Keep readability measurements for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readability-metrics
          path: tmp/quality/metrics.json
          if-no-files-found: ignore
          retention-days: 30

  native-workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ENV: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.7
      - name: Install locked Node dependencies
        run: npm ci
      - name: Run native D1 and Workflow tests
        run: npm run test:workers
      - name: Compile Worker and static client
        run: npm run build
      - name: Package native deployment without cloud access
        run: npx --no-install wrangler deploy --dry-run --config dist/server/wrangler.json

  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_ENV: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.7
      - name: Install locked Node dependencies
        run: npm ci
      - name: Install local Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Compile the actual local Worker and static client
        run: npm run build
      - name: Exercise browser against isolated native D1 and assets
        run: npm run test:e2e
      - name: Keep browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-rehearsal
          path: tmp/playwright
          if-no-files-found: ignore
          retention-days: 7
